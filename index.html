<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicPulse - Red Social</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-color: #262626;
            --border-color: #dbdbdb;
            --primary-color: #0095f6;
            --like-color: #ed4956;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 60px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Container & Feed */
        .main-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }

        .post {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #ccc;
            margin-right: 10px;
            object-fit: cover;
        }

        .username {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .post-img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            display: block;
        }

        .post-actions {
            padding: 10px 12px;
            display: flex;
            gap: 15px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
        }

        .action-btn.liked {
            color: var(--like-color);
        }

        .post-likes {
            padding: 0 12px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .post-caption {
            padding: 6px 12px 12px 12px;
            font-size: 0.9rem;
        }

        .post-caption span {
            font-weight: 600;
            margin-right: 5px;
        }

        /* Navigation Bar */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Modal / Form */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        .modal-content h3 {
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-close {
            background: transparent;
            border: none;
            float: right;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PicPulse</div>
    </header>

    <div class="main-container" id="feed">
        </div>

    <nav>
        <button class="nav-btn" onclick="renderFeed()">🏠</button>
        <button class="nav-btn" onclick="openModal()">➕</button>
    </nav>

    <div class="modal" id="postModal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModal()">✕</button>
            <h3>Crear Publicación</h3>
            <form id="postForm">
                <div class="form-group">
                    <label for="usernameInput">Usuario</label>
                    <input type="text" id="usernameInput" required placeholder="Tu nombre de usuario">
                </div>
                <div class="form-group">
                    <label for="imageInput">Imagen</label>
                    <input type="file" id="imageInput" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label for="captionInput">Pie de foto</label>
                    <textarea id="captionInput" rows="3" placeholder="Escribe un comentario..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Publicar</button>
            </form>
        </div>
    </div>

    <script>
        // Estado inicial / almacenamiento local
        let posts = JSON.parse(localStorage.getItem('picpulse_posts')) || [
            {
                id: 1,
                username: "alex_dev",
                avatar: "https://picsum.photos/id/64/100/100",
                image: "https://picsum.photos/id/1015/600/400",
                caption: "¡Disfrutando del paisaje! 🌲✨",
                likes: 12,
                liked: false
            },
            {
                id: 2,
                username: "creative_mind",
                avatar: "https://picsum.photos/id/65/100/100",
                image: "https://picsum.photos/id/1060/600/400",
                caption: "Un buen café para empezar el día. ☕",
                likes: 5,
                liked: false
            }
        ];

        function savePosts() {
            localStorage.setItem('picpulse_posts', JSON.stringify(posts));
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            posts.forEach(post => {
                const postElement = document.createElement('article');
                postElement.className = 'post';
                postElement.innerHTML = `
                    <div class="post-header">
                        <img src="${post.avatar}" class="avatar" alt="${post.username}">
                        <span class="username">${post.username}</span>
                    </div>
                    <img src="${post.image}" class="post-img" alt="Post">
                    <div class="post-actions">
                        <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                            ${post.liked ? '❤️' : '🤍'}
                        </button>
                    </div>
                    <div class="post-likes">${post.likes} Me gusta</div>
                    <div class="post-caption">
                        <span>${post.username}</span>${post.caption}
                    </div>
                `;
                feed.appendChild(postElement);
            });
        }

        function toggleLike(id) {
            posts = posts.map(post => {
                if (post.id === id) {
                    post.liked = !post.liked;
                    post.likes += post.liked ? 1 : -1;
                }
                return post;
            });
            savePosts();
            renderFeed();
        }

        function openModal() {
            document.getElementById('postModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('postModal').style.display = 'none';
            document.getElementById('postForm').reset();
        }

        // Manejo del envío del formulario
        document.getElementById('postForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('usernameInput').value;
            const caption = document.getElementById('captionInput').value;
            const imageFile = document.getElementById('imageInput').files[0];

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const newPost = {
                        id: Date.now(),
                        username: username,
                        avatar: `https://picsum.photos/seed/${username}/100/100`,
                        image: event.target.result,
                        caption: caption,
                        likes: 0,
                        liked: false
                    };

                    posts.unshift(newPost);
                    savePosts();
                    renderFeed();
                    closeModal();
                };
                reader.readAsDataURL(imageFile);
            }
        });

        // Carga inicial
        renderFeed();
    </script>
</body>
  </html>
